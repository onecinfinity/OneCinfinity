name: Sync Airtable Services to JSON

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch Airtable data
        id: fetch_airtable
        run: |
          curl -s "https://api.airtable.com/v0/appc1UYFrqzIZy0f6/OneCinfinityServices" \
            -H "Authorization: Bearer ${{ secrets.AIRTABLE_TOKEN }}" \
            -o airtable_data.json
      
      - name: Transform and sync to services.json
        run: |
          node .github/workflows/transform-airtable.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Airtable Sync Bot"
          git add data/services.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: sync services from Airtable [skip ci]"
            git push
          fi
