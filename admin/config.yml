backend:
  name: github
  repo: onecinfinity/OneCinfinity
  branch: main
  # Use your external OAuth proxy here, not Netlify Identity.
  # Example: https://YOUR-OAUTH-PROXY-DOMAIN
  base_url: https://decap-cms-oauth-nu.vercel.app
  auth_endpoint: /auth

media_folder: "image/uploads"
public_folder: "/image/uploads"

publish_mode: editorial_workflow
site_url: https://onecinfinity.github.io/OneCinfinity/
display_url: https://onecinfinity.github.io/OneCinfinity/
logo_url: /image/OneCinfinity%20icon.png
show_preview_links: true

collections:
  - name: "services"
    label: "Services"
    files:
      - name: "services-data"
        label: "Services JSON"
        file: "data/services.json"
        format: "json"
        extension: "json"
        identifier_field: "id"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Page Title", name: "pageTitle", widget: "string" }
              - { label: "Card Icon", name: "cardIcon", widget: "image" }
              - { label: "Card Description", name: "cardDescription", widget: "text" }
              - { label: "Main Banner Image", name: "mainBannerImage", widget: "image" }
              - { label: "Main Heading", name: "mainHeading", widget: "string" }
              - { label: "Intro Paragraph", name: "introParagraph", widget: "text" }
              - label: "Overview"
                name: "overview"
                widget: "object"
                fields:
                  - { label: "Paragraph", name: "paragraph", widget: "text" }
                  - label: "Images"
                    name: "images"
                    widget: "list"
                    field: { label: "Image", name: "image", widget: "image" }
              - label: "What's Included"
                name: "whatsIncluded"
                widget: "object"
                fields:
                  - { label: "Paragraph", name: "paragraph", widget: "text" }
                  - label: "Checklist"
                    name: "checklist"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
